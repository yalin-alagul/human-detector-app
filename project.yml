name: HumanDetector
options:
  bundleIdPrefix: com.humandetector
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  HumanDetectorCore:
    path: .

targets:
  HumanDetector:
    type: application
    platform: macOS
    sources:
      - path: Sources/HumanDetectorApp
      - path: Resources/Models
        optional: true
        buildPhase: resources
    dependencies:
      - package: HumanDetectorCore
        product: HumanDetectorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.humandetector.app
        PRODUCT_NAME: Human Detector
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Human Detector
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/HumanDetectorApp/HumanDetector.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  HumanDetectorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HumanDetectorCoreTests
    dependencies:
      - package: HumanDetectorCore
        product: HumanDetectorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.humandetector.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  HumanDetector:
    build:
      targets:
        HumanDetector: all
        HumanDetectorTests: [test]
    test:
      config: Debug
      targets:
        - HumanDetectorTests
    run:
      config: Debug
